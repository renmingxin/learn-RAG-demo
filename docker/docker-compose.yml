services:
  renmx-rag-pg-demo:
    # 必须用 pgvector 镜像：官方 postgres:18 镜像不带 vector 扩展，
    # 否则 CREATE EXTENSION vector 会报 0A000 "extension vector is not available"
    image: pgvector/pgvector:pg18
    ports:
      - 6543:5432
    environment:
      POSTGRES_USER: renmx
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: embedding
    volumes:
      - ./postgres-data:/var/lib/postgresql
